name: Check and build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts benchmarks run.py
      - run: ruff format --check src tests scripts benchmarks run.py
      - run: pytest -q
      - run: python benchmarks/run.py
      - run: python scripts/build.py
      - name: Smoke test portable executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/BEFORE/BEFORE.exe --demo --smoke
            dist/BEFORE/BEFORE.exe cli diagnose --output smoke-report.html
          else
            dist/BEFORE/BEFORE --demo --smoke
            dist/BEFORE/BEFORE cli diagnose --output smoke-report.html
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BEFORE-${{ runner.os }}-x64
          path: dist/BEFORE/
          retention-days: 14
